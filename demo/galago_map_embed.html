<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Galago platskarta</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    #map {
      width: 100%;
      height: 100%;
      min-height: 400px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    (function () {
      function post(type, extra) {
        var msg = Object.assign({ type: type }, extra || {});
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(msg, "*");
          }
        } catch (e) {}
      }

      var map = L.map("map", { scrollWheelZoom: true }).setView([-5, 25], 4);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png", {
        maxZoom: 20,
        subdomains: "abcd",
        attribution: "&copy; OpenStreetMap &copy; CARTO",
      }).addTo(map);

      var marker = null;
      map.on("click", function (e) {
        var la = e.latlng.lat.toFixed(6);
        var lo = e.latlng.lng.toFixed(6);
        if (marker) map.removeLayer(marker);
        marker = L.marker(e.latlng).addTo(map);
        post("galago-map-click", { lat: la, lon: lo });
      });

      function reflow() {
        try {
          map.invalidateSize({ pan: false });
        } catch (e) {}
      }

      reflow();
      requestAnimationFrame(reflow);
      setTimeout(reflow, 150);
      setTimeout(reflow, 600);
      setTimeout(function () {
        reflow();
        post("galago-map-ready");
      }, 1200);
      window.addEventListener("resize", reflow);
    })();
  </script>
</body>
</html>
